<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control Auto</title>

<style>
body {
    margin: 0;
    background: radial-gradient(circle at top, #1f1f1f, #0a0a0a);
    color: white;
    font-family: 'Segoe UI', Arial;
    text-align: center;
}

h2 {
    margin: 20px 0;
    font-weight: 500;
    letter-spacing: 1px;
}

/* Contenedor principal */
.container {
    display: grid;
    grid-template-areas:
        ". forward ."
        "left stop right"
        ". backward .";
    gap: 20px;
    justify-content: center;
    align-items: center;
    height: 75vh;
}

/* Botones */
button {
    width: 90px;
    height: 90px;
    font-size: 28px;
    border-radius: 20px;
    border: none;
    background: linear-gradient(145deg, #2b2b2b, #1a1a1a);
    color: white;
    box-shadow: 5px 5px 10px #000, -3px -3px 8px #333;
    transition: all 0.15s ease;
}

/* Efecto al presionar */
button:active {
    transform: scale(0.92);
    box-shadow: inset 3px 3px 8px #000, inset -3px -3px 8px #333;
}

/* Posiciones tipo D-pad */
.forward { grid-area: forward; }
.backward { grid-area: backward; }
.left { grid-area: left; }
.right { grid-area: right; }
.stop { 
    grid-area: stop; 
    background: linear-gradient(145deg, #ff4d4d, #990000);
}

/* Iconos */
button span {
    display: block;
    font-size: 32px;
}
</style>
</head>

<body>

<h2>Control Auto</h2>

<div class="container">
    <button class="forward"
        onmousedown="send('/forward')" 
        onmouseup="send('/stop')"
        ontouchstart="send('/forward'); event.preventDefault();" 
        ontouchend="send('/stop'); event.preventDefault();">
        F
    </button>

    <button class="left"
        onmousedown="send('/left')" 
        onmouseup="send('/stop')"
        ontouchstart="send('/left'); event.preventDefault();" 
        ontouchend="send('/stop'); event.preventDefault();">
        L
    </button>

    <button class="right"
        onmousedown="send('/right')" 
        onmouseup="send('/stop')"
        ontouchstart="send('/right'); event.preventDefault();" 
        ontouchend="send('/stop'); event.preventDefault();">
        R
    </button>

    <button class="backward"
        onmousedown="send('/backward')" 
        onmouseup="send('/stop')"
        ontouchstart="send('/backward'); event.preventDefault();" 
        ontouchend="send('/stop'); event.preventDefault();">
        B
    </button>
</div>

<script>
function send(cmd) {
    fetch(cmd).catch(() => console.log("error"));
}
</script>

</body>
</html>
